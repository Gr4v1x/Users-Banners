name: Upload User Banner

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "User ID (e.g. 12345)"
        required: true
        type: string
      image_url:
        description: "Image URL (Copy image address)"
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image
        run: |
          mkdir -p banners
          # تحميل الصورة وتحديد الامتداد تلقائياً
          curl -L "${{ github.event.inputs.image_url }}" \
               -o /tmp/banner_raw \
               --max-filesize 5242880  # حد 5MB

          # استخراج الامتداد من الرابط أو نوع الملف
          EXT=$(curl -sI "${{ github.event.inputs.image_url }}" | \
                grep -i content-type | \
                sed 's/.*image\///' | tr -d '\r\n' | \
                sed 's/jpeg/jpg/')
          
          # fallback للامتداد من الرابط
          if [ -z "$EXT" ] || [ "$EXT" = "octet-stream" ]; then
            EXT=$(echo "${{ github.event.inputs.image_url }}" | \
                  sed 's/.*\.\([a-zA-Z0-9]*\).*/\1/' | tr '[:upper:]' '[:lower:]')
          fi

          # افتراضي png إذا فشل كل شيء
          EXT=${EXT:-png}

          cp /tmp/banner_raw "banners/${{ github.event.inputs.user_id }}.${EXT}"
          echo "BANNER_FILE=banners/${{ github.event.inputs.user_id }}.${EXT}" >> $GITHUB_ENV

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add banners/
          git commit -m "Add banner for user ${{ github.event.inputs.user_id }}"
          git push
