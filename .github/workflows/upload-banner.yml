name: Upload User Banner

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "User ID (e.g. 12345)"
        required: true
        type: string
      image_url:
        description: "Image URL (Copy image address)"
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Download and convert image to PNG
        run: |
       
          curl -L "${{ github.event.inputs.image_url }}" \
               -o /tmp/banner_raw \
               --max-filesize 5242880

          convert /tmp/banner_raw "${{ github.event.inputs.user_id }}.png"

          echo "✅ Saved as ${{ github.event.inputs.user_id }}.png"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.png
          git commit -m "Add banner for user ${{ github.event.inputs.user_id }} (.png)"
          git push
