name: Upload User Banner

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Player ID'
        required: true
      image_url:
        description: 'Image URL (Copy image address)'
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download image
        run: |
          mkdir -p banners
          curl -L "${{ github.event.inputs.image_url }}" -o "banners/${{ github.event.inputs.user_id }}.png"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add banners/
          git commit -m "Add banner for player ${{ github.event.inputs.user_id }}"
          git push
