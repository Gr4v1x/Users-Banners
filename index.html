<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Uploader</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0d1117;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    color: #e6edf3;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 36px;
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 6px;
    color: #58a6ff;
  }
  p.sub {
    font-size: .85rem;
    color: #8b949e;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: .82rem;
    color: #8b949e;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 10px 14px;
    color: #e6edf3;
    font-size: .95rem;
    margin-bottom: 18px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: #58a6ff; }
  button {
    width: 100%;
    background: #238636;
    border: none;
    border-radius: 8px;
    padding: 12px;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
  }
  button:hover:not(:disabled) { background: #2ea043; }
  button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

  #preview {
    display: none;
    margin-top: 20px;
    text-align: center;
  }
  #preview img {
    max-width: 100%;
    max-height: 180px;
    border-radius: 8px;
    border: 1px solid #30363d;
  }
  #preview p {
    font-size: .8rem;
    color: #8b949e;
    margin-top: 6px;
  }

  #status {
    margin-top: 20px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: .9rem;
    display: none;
  }
  #status.success { background: #0f2d1a; border: 1px solid #238636; color: #3fb950; }
  #status.error   { background: #2d0f0f; border: 1px solid #da3633; color: #f85149; }
  #status.loading { background: #0d1f36; border: 1px solid #1f6feb; color: #58a6ff; }

  .link-box {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: .8rem;
    color: #58a6ff;
    word-break: break-all;
    margin-top: 10px;
    cursor: pointer;
    user-select: all;
  }
</style>
</head>
<body>
<div class="card">
  <h1>🖼️ Banner Uploader</h1>
  <p class="sub">Upload your banner directly to the repository</p>

  <label>GitHub Token (repo scope)</label>
  <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">

  <label>Your ID</label>
  <input type="text" id="userId" placeholder="e.g. 12345">

  <label>Image URL (Copy image address)</label>
  <input type="url" id="imageUrl" placeholder="https://example.com/image.png"
         oninput="previewImage(this.value)">

  <div id="preview">
    <img id="previewImg" src="" alt="Preview">
    <p>Preview</p>
  </div>

  <button id="uploadBtn" onclick="upload()">⬆️ Upload Banner</button>

  <div id="status"></div>
</div>

<script>
const OWNER = "moatasemX99";
const REPO  = "Users-Banners";
const BRANCH = "main";

function previewImage(url) {
  const p = document.getElementById("preview");
  const img = document.getElementById("previewImg");
  if (url.startsWith("http")) {
    img.src = url;
    p.style.display = "block";
  } else {
    p.style.display = "none";
  }
}

function setStatus(msg, type, extra = "") {
  const el = document.getElementById("status");
  el.style.display = "block";
  el.className = type;
  el.innerHTML = msg + (extra ? `<div class="link-box" title="Click to copy" onclick="navigator.clipboard.writeText(this.innerText)">${extra}</div>` : "");
}

async function urlToBase64(url) {
  const proxies = [
    `https://corsproxy.io/?${encodeURIComponent(url)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://proxy.cors.sh/${url}`,
  ];

  for (const proxy of proxies) {
    try {
      const res = await fetch(proxy);
      if (!res.ok) continue;
      const buf = await res.arrayBuffer();
      if (buf.byteLength === 0) continue;
      const bytes = new Uint8Array(buf);
      let bin = "";
      for (let b of bytes) bin += String.fromCharCode(b);
      return btoa(bin);
    } catch (_) { continue; }
  }

  throw new Error("Failed to fetch image — تأكد أن الرابط صحيح أو جرب رابطاً آخر");
}

async function getFileSHA(path, token) {
  const res = await fetch(
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,
    { headers: { Authorization: `token ${token}` } }
  );
  if (res.status === 404) return null;
  const data = await res.json();
  return data.sha || null;
}

async function upload() {
  const token   = document.getElementById("token").value.trim();
  const userId  = document.getElementById("userId").value.trim();
  const imgUrl  = document.getElementById("imageUrl").value.trim();
  const btn     = document.getElementById("uploadBtn");

  if (!token || !userId || !imgUrl) {
    setStatus("⚠️ Please fill all fields.", "error"); return;
  }

  btn.disabled = true;
  setStatus("⏳ Fetching image...", "loading");

  try {
    const base64 = await urlToBase64(imgUrl);

    setStatus("⏳ Uploading to GitHub...", "loading");

    const path = `${userId}.png`;
    const sha  = await getFileSHA(path, token);

    const body = {
      message: `Upload banner for user ${userId}`,
      content: base64,
      branch: BRANCH,
      ...(sha && { sha })
    };

    const res = await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,
      {
        method: "PUT",
        headers: {
          Authorization: `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      }
    );

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.message || "GitHub API error");
    }

    const rawUrl = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${path}`;
    setStatus("✅ Banner uploaded successfully! Your link:", "success", rawUrl);

  } catch (e) {
    setStatus("❌ Error: " + e.message, "error");
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
